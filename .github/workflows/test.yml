name: Test
on: [push, pull_request, workflow_dispatch]
jobs:
    test:
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          os: [ubuntu-latest]
          python-version: ['3.11']
      steps:
      - uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip poetry
          poetry config virtualenvs.in-project true
          poetry install --extras sb-integration --no-interaction
          poetry run pip install pytest pytest-cov flake8
      - name: Lint with flake8
        run: |
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          poetry run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        env:
          HOME: ${{ github.workspace }}/.pcse_home
        run: |
          mkdir -p "$HOME/logs" "$HOME/meteo_cache"
          poetry run python -m pytest tests/test_ceres.py tests/test_model.py -W ignore::DeprecationWarning
